<!-- ======================= DESKTOP ======================= -->
<header class="navbar d-none d-md-block">
  <div class="container-narrow navbar-inner">
    <a href="#top" class="brand">{{ profile.handle }}&#64;{{ profile.host }}<span class="cursor">_</span></a>

    <nav class="links">
      <span
        class="indicator"
        [style.opacity]="desktopActiveIndex === -1 ? 0 : 1"
        [style.width.%]="100 / desktopLinks.length"
        [style.transform]="'translateX(' + (desktopActiveIndex * 100) + '%)'"
      ></span>
      <a
        *ngFor="let link of desktopLinks; let i = index"
        [href]="link.href"
        [class.active]="desktopActiveIndex === i"
      >./{{ link.label }}</a>
    </nav>

    <div class="status">
      <span class="status-dot"></span>
      {{ profile.availability }}
    </div>
  </div>
</header>

<!-- ==================== MOBILE HEADER ===================== -->
<header class="mobile-header d-md-none">
  <span class="brand">{{ profile.name }}</span>
  <span class="status">
    <span class="status-dot"></span>
  </span>
</header>

<!-- ==================== MOBILE TAB BAR ===================== -->
<nav class="mobile-tabbar d-md-none" aria-label="Navigation principale">
  <span
    class="mobile-indicator"
    [style.width.%]="100 / mobileTabs.length"
    [style.transform]="'translateX(' + (mobileActiveIndex * 100) + '%)'"
  ></span>

  <a
    *ngFor="let tab of mobileTabs; let i = index"
    [href]="'#' + tab.id"
    class="tab"
    [class.active]="mobileActiveIndex === i"
    (click)="select(i)"
  >
    <i class="bi" [ngClass]="tab.icon"></i>
    <span>{{ tab.label }}</span>
  </a>
</nav>
